name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p shim-core -p shim-win --all-targets -- -D warnings
      - run: cargo test -p shim-core -p shim-win
      - name: Generated TypeScript bindings are committed
        run: |
          git add -N src/lib/generated
          git diff --exit-code -- src/lib/generated

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # `npm install`, not `npm ci`: the lockfile is generated on one OS and omits the
      # other platforms' optional native bindings (rolldown), see npm/cli#4828.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      # `npm install`, not `npm ci`: the lockfile is generated on one OS and omits the
      # other platforms' optional native bindings (rolldown), see npm/cli#4828.
      - run: npm install --no-audit --no-fund
      # tauri::generate_context! embeds ../dist at compile time.
      - run: npm run build
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: shim-windows-x64
          path: target/release/shim.exe
