name: Release

# Tag `vX.Y.Z` → NSIS installer + portable exe + SHA256SUMS.txt on a draft
# GitHub release. Code signing is added once a certificate exists; hashes are
# published regardless (PLAN §3).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
      - run: npm ci
      - name: Version in tag matches the workspace
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $cargo -or $tag -ne $tauri) { throw "tag $tag, Cargo.toml $cargo, tauri.conf.json $tauri disagree" }
      - run: npm run build
      - run: cargo test --workspace
      - run: npx tauri build
      - name: Collect artifacts and hashes
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          Copy-Item target/release/shim.exe out/shim-portable.exe
          Copy-Item components.json out/
          Get-ChildItem out | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content out/SHA256SUMS.txt -NoNewline:$false
          Get-Content out/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: out/*
